---
sites:
  site:
    latitude: 35.2018863
    longitude: -101.945027
    resources:
      solar_resource:
        resource_model: NSRDBDatasetH5
        resource_parameters:
          resource_year: 2025
plant:
  plant_life: 30
  simulation:
    dt: 3600
    n_timesteps: 8760
technology_interconnections:
  - [existing_plant, poi_demand, electricity, cable]
  # combine the battery output with the wind generation
  - [poi_demand, second_demand, [unmet_electricity_demand_out, electricity_demand]]
  - [solar_add_on, second_demand, electricity, cable]
  - [second_demand, grid_sell, electricity, cable]
site_to_tech_connections:
  - [site.solar_resource, existing_plant, solar_resource_data]
  - [site.solar_resource, solar_add_on, solar_resource_data]
finance_parameters:
  finance_groups: !include /kfs2/projects/surint/campd_spheres/national_analysis/software/nice_us/library/h2i_sweep_1/existing_fixed_solar_add_solar/finance_groups_add_solar.yaml
  finance_subgroups:
    added_electricity:
      commodity: electricity
      commodity_stream: grid_sell
      commodity_stream_output: electricity_sold
      use_commodity_stream_timeseries: true
      technologies: [solar_add_on, grid_sell]
      finance_groups: [profast_npv]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.02
    target_dollar_year: 2023
correlation_parameters:
  techs_specific_outputs_profiles: 
    grid_sell: [electricity_sold, electricity_excess, energy_price, capacity_price, electricity_sell_price, grid_sell_capacity_revenue, grid_sell_energy_revenue, electricity_sell_headroom]
    grid_buy: [grid_buy_energy_cost, electricity_out, electricity_headroom] # only battery and solar+battery case