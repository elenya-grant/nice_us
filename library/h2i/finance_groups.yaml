---
# profast_npv:
finance_model: ProFastNPV
model_inputs:
    # Zero on purpose. grid_sell already values every exported kilowatt-hour
    # at that hour's LMP and reports it as negative VarOpEx, which ProFAST
    # picks up as a coproduct. A nonzero price here would pay for the same
    # energy a second time.
  commodity_sell_price: 0.0
  commodity_sell_price_units: USD/(kW*h)
  params:
    analysis_start_year: 2032
    installation_time: 24  # months
    inflation_rate: 0.0  # 0 for nominal analysis
    discount_rate: 0.09
    debt_equity_ratio: 2.62
    property_tax_and_insurance: 0.03
    total_income_tax_rate: 0.257
    capital_gains_tax_rate: 0.15
    sales_tax_rate: 0.07375
    debt_interest_rate: 0.07
    debt_type: Revolving debt
    loan_period_if_used: 0
    cash_onhand_months: 1
    admin_expense: 0.00
  capital_items:
    depr_type: MACRS
    depr_period: 5
    refurb: [0.]
