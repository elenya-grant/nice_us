---
performance_model:
  model: GridPerformanceModel
cost_model:
  model: CustomGridCostModel
  model_location: /projects/surint/campd_spheres/national_analysis/software/nice_us/nice/simulation/h2i_models/custom_grid.py
model_inputs:
  shared_parameters:
    interconnection_size: 1.e6  # kW  # set based on DOE csv
  cost_parameters:
    data_directory: /projects/surint/campd_spheres/national_analysis/
    electricity_buy_price: 0.0
    cost_year: 2022  # TODO make sure this is the correct year for the cost data
    interconnection_capex_per_kw: 0.0  # $/kW capital cost
    interconnection_opex_per_kw: 0.0  # $/kW/year O&M cost
    fixed_interconnection_cost: 0.0  # $ one-time fixed cost
