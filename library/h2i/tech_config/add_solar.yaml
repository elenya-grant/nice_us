---
# ATB Representative Plant: single-axis tracking utility scale
performance_model:
  model: PYSAMSolarPlantPerformanceModel
cost_model:
  model: ATBUtilityPVCostModel
model_inputs:
  performance_parameters:
    pv_capacity_kWdc: 200000  # sweep value in DOE
    dc_ac_ratio: 1.34  # based on 2025 ATB assumption
    create_model_from: new
    tilt_angle_setting: lat-func  # determine appropriate tilt based on latitude
    # tilt: 0
    azimuth_angle_setting: lat-func
    pysam_options:
      SystemDesign:
        gcr: 0.3
        array_type: 2  # 2: 1-axis tracking, 1: fixed roof mount, 4: 2-axis tracking
        bifaciality: 0.65
        inv_eff: 96.0
        losses: 14.0757  # dc losses Pvwattsv8 default
        module_type: 1  # 0: standard (19%), 1: premium (21%), 2: thin film (18%)
        azimuth: 180  # 180 is south-facing
        rotlim: 45  # typical rotational limit
      SolarResource:
        use_wf_albedo: 1  # 1: use albedo from weather file
        albedo_default: 0.2
  cost_parameters:
    capex_per_kWac: 1247  # overnight capital cost in $/kW-AC moderate 2025. (2025 ATB)
    opex_per_kWac_per_year: 24  # fixed O&M $/kw-AC/year moderate 2025. (2025 ATB)
    cost_year: 2023
    # CdTe 19%
    # A-SI: 14%
    # CIGS: 23%
    # Crystalline Silicon: 24-26%
    # https://solarmagazine.com/solar-panels/thin-film-solar-panels/
