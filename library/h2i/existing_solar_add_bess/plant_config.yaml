---
name: plant_config
description: >
  Battery added to an existing plant that is connected to the grid. The
  LP values only the addition: it may sell no more than the existing plant
  leaves unserved. The addition has no on-site load of its own, so its demand
  component is set to zero and all of its production flows through
  ``unused_electricity_out`` to the export grid connection.
sites:
  site:
    latitude: 30.6617
    longitude: -101.7096
    resources:
      solar_resource:
        resource_model: NSRDBDatasetH5
        resource_parameters:
          resource_year: 2025
technology_interconnections:
  # Existing plant: connected to the grid poi
  - [existing_plant, poi_demand, electricity, cable]
  # The grid can charge the battery.
  - [grid_buy, battery, electricity, cable]
  # Delivery bus: the battery's net output is negative while charging, which
  # cancels the charging draw taken from the source bus.
  - [battery, electrical_load_demand, electricity, cable]
  # Export path: everything the (zero) load does not consume is sold.
  - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_set_point]]
  - [electrical_load_demand, grid_sell, [unused_electricity_out, electricity_in]]
resource_to_tech_connections:
  - [site.solar_resource, existing_plant, electricity, cable]
plant:
  plant_life: 30
  simulation:
    n_timesteps: 8760
    dt: 3600
system_level_control:
  control_strategy: LPArbitrageControl
  demand_component: electrical_load_demand
  export_component: grid_sell
  uncontrolled_components: [existing_plant]
  control_parameters:
    n_control_window_hours: 24
    cost_per_tech:
      grid_buy: buy_price  # marginal cost of an import is the hourly LMP
    # Value only the addition: sell no more than the existing plant leaves
    # unserved, and absorb what it spills.
    export_limit_component: poi_demand
    storage_cycle_cost: 0.001  # $/kWh throughput; breaks ties between schedules
    value_of_lost_load: 10.0
    solver_name: glpk
  solver_options:
    solver_name: gauss_seidel
    max_iter: 30
    convergence_tolerance: 1.0e-6
    solver_option_kwargs:
      use_aitken: true
finance_parameters:
  finance_groups: !include ./finance_groups.yaml
  finance_subgroups:
    added_electricity:
      commodity: electricity
      # Value what is actually sold, not what reaches the delivery bus. The
      # export ceiling curtails a large share of the throughput at out_combiner,
      # so using that stream would book revenue on energy that is never sold.
      commodity_stream: grid_sell
      use_commodity_stream_timeseries: true
      commodity_stream_output: electricity_sold
      finance_groups: [profast_npv]
      technologies: [battery, grid_buy, grid_sell]
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025
    target_dollar_year: 2022
