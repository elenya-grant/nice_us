---
description: Driver config for CSVGen parameter sweep
name: driver_config
general:
  folder_output:  #
  create_om_reports: false
driver:
  parameter_sweep:
    flag: true
    debug_print: true
    generator: csvgen
    filename: existing_wind_plant_sitelist_2025_rev_pv_capac.csv
    run_parallel: false
design_variables:
  # made with nice/analysis/make_existing_wind_doe.py
  wind:
    wind_turbine_hub_ht:
      flag: true
      units: m
    wind_turbine_rotor_diameter:
      flag: true
      units: m
    wind_turbine_rating:
      flag: true
      units: MW
    num_turbines:
      flag: true
      units: unitless
  add_on_solar:
    system_capacity_DC:
      flag: true
      # lower: 5000.0
      # upper: 75000.0
      units: kW
  site:
    latitude:
      flag: true
      units: deg
      lower: -90.0
      upper: 90.0
    longitude:
      flag: true
      units: deg
      lower: -180.0
      upper: 180.0
  poi_demand:
    electricity_demand:
      flag: true
      units: MW
  grid_sell_solar:
    interconnection_size:
      flag: true
      units: MW
    plant_code:
      flag: true
      units: unitless
