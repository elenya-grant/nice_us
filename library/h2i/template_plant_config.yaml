---
sites:
  site:
    latitude: 35.2018863  # remove
    longitude: -101.945027
    resources:
      solar_resource:
        resource_model:  # add in
        resource_parameters:
          resource_year: 2025
plant:
  plant_life: 30
  simulation:
    dt: 3600
    n_timesteps: 8760
technology_interconnections:
  - [existing_plant, poi_demand, electricity, cable]
  # combine the battery output with the wind generation
  - [poi_demand, second_demand, [unmet_electricity_demand_out, electricity_demand]]
  - [solar_add_on, second_demand, electricity, cable]
  - [second_demand, grid_sell_solar, electricity, cable]
resource_to_tech_connections:
  # connect the wind resource to the wind technology
  - [site.solar_resource, solar_add_on, solar_resource_data]
finance_parameters:
  finance_groups:
  cost_adjustment_parameters:
    cost_year_adjustment_inflation: 0.025  # used to adjust modeled costs to target_dollar_year
    target_dollar_year: 2022
  finance_subgroups:  # for second tech interconnections
    with_add_on:
            # we want to calc the revenue from selling solar to the grid
            # want the solar contribution of grid sell
            # costs: solar, grid revenue ONLY from solar
            # AEP/CF source: only solar that's sold to grid?
      commodity: electricity
      commodity_stream: grid_sell_solar
      commodity_stream_output: electricity_sold
      use_commodity_stream_timeseries: true
      technologies: [solar_add_on, grid_sell_solar]
