---
performance_model:
  model: PYSAMWindPlantPerformanceModel
model_inputs:
  performance_parameters:
    num_turbines: 216  # read in from DOE csv
    turbine_rating_kw: 6000  # read in from DOE csv
    rotor_diameter: 170.  # read in from DOE csv
    hub_height: 115.  # read in from DOE csv
    create_model_from: new
    layout:
      layout_mode: basicgrid
      layout_options:
        row_D_spacing: 7.0
        turbine_D_spacing: 7.0
        rotation_angle_deg: 0.0
        row_phase_offset: 0.0
        layout_shape: square
